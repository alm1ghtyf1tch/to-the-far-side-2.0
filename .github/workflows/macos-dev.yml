name: macOS development build
on:
  workflow_dispatch:
  push:
    branches: [visual-overhaul]
    paths: ['project.godot', 'export_presets.cfg', 'systems/**', 'screens/**', 'data/**', 'environments/**', 'assets/**', '.github/workflows/macos-dev.yml']
permissions:
  contents: read
concurrency:
  group: macos-dev-${{ github.ref }}
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo '/tmp/godot' >> "$GITHUB_PATH"
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -qj /tmp/templates.tpz 'templates/macos.zip' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
      - name: Import and verify the original simulation
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/simulation_regression.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/rogue_save_regression.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/rogue_runs.gd
      - name: Export signed development ZIP
        run: |
          mkdir -p build/macos
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release 'macOS Dev' build/macos/ToTheFarSide-macOS-Dev.zip
          python3 tools/validate_macos.py build/macos/ToTheFarSide-macOS-Dev.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ToTheFarSide-macOS-Dev
          path: build/macos/ToTheFarSide-macOS-Dev.zip
          if-no-files-found: error
          retention-days: 30
